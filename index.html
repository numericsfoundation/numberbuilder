<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Numerics Animation</title>
<style>
body{font-family:Arial;background:#eef2f6;margin:0}
.wrap{max-width:1100px;margin:20px auto;background:white;padding:20px;border-radius:12px}
.controls{text-align:center;margin-bottom:10px}
canvas{display:block;margin:auto;border:1px solid #ccc;border-radius:10px;background:#f9fbfd}
select,button{font-size:16px;padding:8px 12px;margin:0 4px}
</style>
</head>
<body>
<div class="wrap">
<div class="controls">
<select id="num"></select>
<button id="playBtn">Play</button>
<button id="pauseBtn">Pause</button>
<button id="resetBtn">Reset</button>
<button id="revealBtn">Reveal Number</button>
</div>
<canvas id="c" width="1000" height="650"></canvas>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const sel=document.getElementById('num');
const playBtn=document.getElementById('playBtn');
const pauseBtn=document.getElementById('pauseBtn');
const resetBtn=document.getElementById('resetBtn');
const revealBtn=document.getElementById('revealBtn');

for(let i=0;i<=100;i++){
  const o=document.createElement('option');
  o.value=i;
  o.text=i;
  sel.appendChild(o);
}

const BLOCK=18;
const SOURCE={x:60,y:180,w:240,h:320};
const RODS={x:420,y:180};
const ONES={x:700,y:180};
const ROD_CELL=22;
const ROD_ROW=28;
const ONES_CELL=28;
const MOVE_DURATION=760;
const LINE_FORM_DURATION=40;
const ROD_MOVE_DURATION=120;
const PAUSE_DURATION=120;
const TEN_PAUSE_DURATION=1000;

let blocks=[];
let order=[];
let plan=[];
let n=0;
let preparedNumber=0;
let placedCount=0;
let tensCount=0;
let running=false;
let paused=false;
let rafId=null;
let moveIndex=0;
let moveStart=0;
let revealed=false;
let pauseStartedAt=0;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function ease(t){
  return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function makeBlocks(num){
  blocks=[];
  const pts=[];
  for(let i=0;i<num;i++){
    let x=SOURCE.x;
    let y=SOURCE.y;
    let ok=false;
    let tries=0;
    while(!ok&&tries<1500){
      x=SOURCE.x+Math.random()*(SOURCE.w-BLOCK);
      y=SOURCE.y+Math.random()*(SOURCE.h-BLOCK);
      ok=true;
      for(const p of pts){
        if(Math.hypot(x-p.x,y-p.y)<18){ok=false;break;}
      }
      tries++;
    }
    pts.push({x,y});
    blocks.push({x,y,startX:x,startY:y,tx:x,ty:y,zone:'loose',rod:null});
  }
  order=shuffle([...Array(num).keys()]);
}

function buildPlan(){
  plan=[];
  const onesOrder=[];

  for(let i=0;i<n;i++){
    const id=order[i];
    onesOrder.push(id);
    const onesIndex=i%10;
    const row=Math.floor(onesIndex/5);
    const col=onesIndex%5;

    plan.push({
      type:'toOnes',
      id:id,
      tx:ONES.x+col*ONES_CELL+(ONES_CELL-BLOCK)/2,
      ty:ONES.y+row*ONES_CELL+(ONES_CELL-BLOCK)/2
    });

    if((i+1)%10===0){
      const rod=Math.floor(i/10);
      const baseLineX=ONES.x+(ONES_CELL-BLOCK)/2;
      const baseLineY=ONES.y+ONES_CELL+(ONES_CELL-BLOCK)/2;
      const ids=onesOrder.slice(rod*10,rod*10+10);

      plan.push({
        type:'lineUpGroup',
        rod:rod,
        ids:ids,
        baseX:baseLineX,
        baseY:baseLineY
      });

      plan.push({type:'preTenPause'});

      plan.push({
        type:'toRodGroup',
        rod:rod,
        ids:ids
      });

      plan.push({type:'tenComplete'});
    }
  }
}

function prepareNumber(num){
  preparedNumber=num;
  n=num;
  running=false;
  paused=false;
  moveIndex=0;
  moveStart=0;
  pauseStartedAt=0;
  placedCount=0;
  tensCount=0;
  revealed=false;
  plan=[];
  if(rafId) cancelAnimationFrame(rafId);
  makeBlocks(num);
  draw();
}

function start(){
  if(paused){
    paused=false;
    if(!running){
      running=true;
      rafId=requestAnimationFrame(loop);
    }
    return;
  }
  if(running) return;

  n=preparedNumber;
  moveIndex=0;
  moveStart=0;
  pauseStartedAt=0;
  placedCount=0;
  tensCount=0;
  makeBlocks(n);
  buildPlan();
  running=true;
  paused=false;
  rafId=requestAnimationFrame(loop);
}

function resetAll(){
  if(rafId) cancelAnimationFrame(rafId);
  running=false;
  paused=false;
  moveIndex=0;
  moveStart=0;
  pauseStartedAt=0;
  placedCount=0;
  tensCount=0;
  sel.style.visibility='visible';
  sel.value='0';
  prepareNumber(0);
}

function beginGroupStep(step, now){
  step.startPositions=step.ids.map(id=>({id:id,x:blocks[id].x,y:blocks[id].y}));
  moveStart=now;
}

function update(now){
  if(!running||paused) return;
  if(moveIndex>=plan.length){
    running=false;
    return;
  }

  const step=plan[moveIndex];

  if(step.type==='preTenPause'){
    if(pauseStartedAt===0) pauseStartedAt=now;
    if(now-pauseStartedAt>=1000){
      moveIndex++;
      pauseStartedAt=0;
    }
    return;
  }

  if(step.type==='tenComplete'){
    if(pauseStartedAt===0) pauseStartedAt=now;
    if(now-pauseStartedAt>=TEN_PAUSE_DURATION){
      tensCount++;
      moveIndex++;
      pauseStartedAt=0;
    }
    return;
  }

  if(step.type==='lineUpGroup'){
    if(moveStart===0) beginGroupStep(step, now);
    const elapsed=now-moveStart;
    const t=Math.min(1, elapsed/LINE_FORM_DURATION);
    const e=ease(t);

    for(let i=0;i<step.ids.length;i++){
      const start=step.startPositions[i];
      const b=blocks[start.id];
      const targetX=step.baseX + i*ONES_CELL;
      const targetY=step.baseY;
      b.x=start.x+(targetX-start.x)*e;
      b.y=start.y+(targetY-start.y)*e;
      b.zone='ones';
    }

    if(t>=1){
      moveIndex++;
      moveStart=0;
    }
    return;
  }

  if(step.type==='toRodGroup'){
    if(moveStart===0) beginGroupStep(step, now);
    const elapsed=now-moveStart;
    const t=Math.min(1, elapsed/ROD_MOVE_DURATION);
    const e=ease(t);
    const baseX=RODS.x+(ROD_CELL-BLOCK)/2;
    const baseY=RODS.y+step.rod*ROD_ROW+(ROD_CELL-BLOCK)/2;

    for(let i=0;i<step.ids.length;i++){
      const start=step.startPositions[i];
      const b=blocks[start.id];
      const targetX=baseX + i*ROD_CELL;
      const targetY=baseY;
      b.x=start.x+(targetX-start.x)*e;
      b.y=start.y+(targetY-start.y)*e;
      b.zone='rod';
      b.rod=step.rod;
    }

    if(t>=1){
      moveIndex++;
      moveStart=0;
    }
    return;
  }

  const b=blocks[step.id];
  if(moveStart===0){
    b.startX=b.x;
    b.startY=b.y;
    b.tx=step.tx;
    b.ty=step.ty;
    if(step.type==='toOnes') b.zone='ones';
    moveStart=now;
  }

  const elapsed=now-moveStart;
  const t=Math.min(1,elapsed/MOVE_DURATION);
  const e=ease(t);
  const smooth=e*e*(3-2*e);

  b.x=b.startX+(b.tx-b.startX)*smooth;
  b.y=b.startY+(b.ty-b.startY)*smooth;

  if(t>=1&&elapsed>=MOVE_DURATION+PAUSE_DURATION){
    b.x=b.tx;
    b.y=b.ty;
    if(step.type==='toOnes') placedCount++;
    moveIndex++;
    moveStart=0;
  }
}

function drawNumberLine(){
  const sx=70, ex=930, y=70;
  const step=(ex-sx)/100;

  ctx.strokeStyle='#888';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(sx,y);
  ctx.lineTo(ex,y);
  ctx.stroke();

  for(let i=1;i<=100;i++){
    const x=sx+i*step;
    ctx.fillStyle=i<=placedCount?'#5a7da8':'#ccc';
    ctx.fillRect(x-2,y-6,4,12);
  }

  ctx.fillStyle='#2f3e50';
  ctx.font='12px Arial';
  ctx.textAlign='center';
  ctx.fillText('0',sx,y+20);
  ctx.fillText('50',sx+50*step,y+20);
  ctx.fillText('100',ex,y+20);

  ctx.fillStyle='#d18b00';
  ctx.font='11px Arial';
  for(let t=1;t<=tensCount;t++){
    const value=t*10;
    const x=sx+value*step;
    ctx.beginPath();
    ctx.arc(x,y-12,5,0,Math.PI*2);
    ctx.fill();
    ctx.fillText(String(value),x,y-20);
  }
}

function drawRodBackings(){
  for(let r=0;r<tensCount;r++){
    const x=RODS.x-4;
    const y=RODS.y+r*ROD_ROW-2;
    ctx.fillStyle='#fff3d8';
    ctx.strokeStyle='#e3c78f';
    rr(x,y,10*ROD_CELL+8,24,6);
    ctx.fill();
    ctx.stroke();
  }
}

function draw(){
  ctx.clearRect(0,0,1000,650);
  drawNumberLine();

  const onesBuilt=Math.max(0,placedCount-(tensCount*10));

  ctx.fillStyle='#5a7da8';
  ctx.font='700 26px Arial';
  ctx.textAlign='center';
  ctx.fillText('Loose Blocks',SOURCE.x+SOURCE.w/2,130);
  ctx.fillText(String(tensCount)+' Tens',RODS.x+(10*ROD_CELL)/2,130);
  ctx.fillText(String(onesBuilt)+' Ones',ONES.x+60,130);

  if(revealed&&placedCount===n&&!running){
    ctx.fillStyle='#2f3e50';
    ctx.font='700 44px Arial';
    ctx.fillText(String(n),SOURCE.x+SOURCE.w/2,RODS.y+(ROD_CELL-BLOCK)/2+BLOCK);
  }

  drawRodBackings();

  for(const b of blocks){
    let fill='#5a7da8';
    let stroke='#48698f';
    if(b.zone==='rod'&&b.rod!==null&&b.rod<tensCount){
      fill='#d6a754';
      stroke='#9a732a';
    }
    ctx.fillStyle=fill;
    ctx.strokeStyle=stroke;
    ctx.fillRect(b.x,b.y,BLOCK,BLOCK);
    ctx.strokeRect(b.x,b.y,BLOCK,BLOCK);
  }
}

function loop(now){
  update(now);
  draw();
  if(running) rafId=requestAnimationFrame(loop);
}

pauseBtn.onclick=()=>{
  if(running) paused=!paused;
};

sel.addEventListener('change',()=>{
  prepareNumber(Number(sel.value));
  sel.style.visibility='hidden';
});

revealBtn.onclick=()=>{
  sel.style.visibility='visible';
  revealed=true;
  draw();
};

playBtn.onclick=start;
resetBtn.onclick=resetAll;

sel.value='0';
prepareNumber(0);
</script>
</body>
</html>
