


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numerics Animation</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f6;margin:0}
.wrap{max-width:1100px;margin:20px auto;background:white;padding:20px;border-radius:12px}
.controls{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;white-space:nowrap;overflow-x:auto}
canvas{display:block;margin:auto;border:1px solid #ccc;border-radius:10px;background:#f9fbfd}
select,button{font-size:13px;padding:6px 8px;margin:0;flex:0 0 auto}
#countMode{max-width:245px}
#itemType{max-width:130px}
#num{max-width:70px}
</style>
</head>
<body>
<div class="wrap">

<div style="text-align:center; font-size:28px; font-weight:bold; margin-bottom:10px;">
Numerics Number Builder
</div>
<div class="controls">
<select id="itemType">
<option value="squares">Squares</option>
<option value="dots">Dots</option>
<option value="apples">Apples</option>
<option value="leaves">Leaves</option>
<option value="pumpkins">Pumpkins</option>
<option value="snowflakes">Snowflakes</option>
<option value="candycanes">Christmas Trees</option>
<option value="shamrocks">Shamrocks</option>
<option value="flowers">Flowers</option>
<option value="suns">Suns</option>
<option value="presents">Presents</option>
<option value="dogs">Dogs</option>
<option value="cats">Cats</option>
<option value="fish">Fish</option>
</select>
<select id="countMode">
<option value="showOnesCountOnes">Show Ones, Count Ones</option>
<option value="showTensOnesCountBoth">Show Tens and Ones, Count Both</option>
<option value="showTensOnesCountTensFirst">Show Tens and Ones, Count Tens First</option>
<option value="showTensOnesNoHeaders">Show Tens and Ones, No Headers</option>
</select>
<select id="num"></select>
<button id="forwardBtn">Count Forward</button>
<button id="backwardBtn">Count Backward</button>
<button id="pauseBtn">Pause</button>
<button id="resetBtn">Reset</button>
<button id="revealBtn">Reveal Number</button>
<button id="convertBtn" type="button">Change Units</button>
</div>

<canvas id="c" width="1000" height="650"></canvas>
</div>

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function ease(t){
  return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function rodPos(indexInRod, rod){
  return {
    x: RODS.x + (ROD_CELL - BLOCK)/2 + indexInRod * ROD_CELL,
    y: RODS.y + rod * ROD_ROW + (ROD_CELL - BLOCK)/2
  };
}

function onesGridPos(slot){
  if(typeof isShowOnesOnly === 'function' && isShowOnesOnly()){
    const group = Math.floor(slot / 10);
    const withinGroup = slot % 10;
    const row = Math.floor(withinGroup / 5);
    const col = withinGroup % 5;

    const groupGapY = 14;
    const groupHeight = 2 * ONES_CELL + groupGapY;

    // determine layout: 1 column for 1–50, 2 columns for 51–100
    const totalGroups = Math.ceil((visibleTotal || preparedNumber) / 10);
    const useTwoCols = totalGroups > 5;

    let columnGroup = 0;
    let groupInColumn = group;

    if(useTwoCols){
      columnGroup = Math.floor(group / 5);
      groupInColumn = group % 5;
    }

    const columnGapX = 28;
    const visibleGroupWidth = 4 * ONES_CELL + BLOCK;

    const totalWidth = useTwoCols
      ? visibleGroupWidth * 2 + columnGapX
      : visibleGroupWidth;

    const centerX = RODS.x + 220; // anchor under Ones header
    const startX = centerX - totalWidth / 2;

    return {
      x: startX + columnGroup * (visibleGroupWidth + columnGapX) + col * ONES_CELL,
      y: ONES.y + (ONES_CELL - BLOCK)/2 + groupInColumn * groupHeight + row * ONES_CELL
    };
  }

  const row = Math.floor(slot / 5);
  const col = slot % 5;
  const shiftedOnesX = ONES.x + 70;
  return {
    x: shiftedOnesX + (ONES_CELL - BLOCK)/2 + col * ONES_CELL,
    y: ONES.y + (ONES_CELL - BLOCK)/2 + row * ONES_CELL
  };
}

function onesLinePos(index){
  return {
    x: ONES.x + (ONES_CELL - BLOCK)/2 + index * ONES_CELL,
    y: ONES.y + ONES_CELL + (ONES_CELL - BLOCK)/2
  };
}

function drawApple(x,y){
  ctx.save();
  ctx.translate(x + BLOCK/2, y + BLOCK/2);
  ctx.scale(SCALE, SCALE);

  // apple body
  ctx.fillStyle = '#d94b45';
  ctx.beginPath();
  ctx.moveTo(0, -5);
  ctx.bezierCurveTo(-7, -9, -11, -3, -10, 4);
  ctx.bezierCurveTo(-9, 11, -3, 12, 0, 8);
  ctx.bezierCurveTo(3, 12, 9, 11, 10, 4);
  ctx.bezierCurveTo(11, -3, 7, -9, 0, -5);
  ctx.fill();

  // soft outline
  ctx.strokeStyle = '#9f2f2d';
  ctx.lineWidth = 1;
  ctx.stroke();

  // top dip
  ctx.fillStyle = '#b63a36';
  ctx.beginPath();
  ctx.arc(0, -5, 2.2, 0, Math.PI, false);
  ctx.fill();

function drawPumpkin(x,y){
  ctx.save();
  ctx.translate(x + BLOCK/2, y + BLOCK/2);
  ctx.scale(SCALE, SCALE);

  // pumpkin lobes
  ctx.fillStyle = '#f28c28';
  for(const part of [
    {dx:-6, rx:4.8, ry:7},
    {dx:6, rx:4.8, ry:7},
    {dx:-2.5, rx:5.2, ry:8},
    {dx:2.5, rx:5.2, ry:8},
    {dx:0, rx:5.5, ry:8.5}
  ]){
    ctx.beginPath();
    ctx.ellipse(part.dx, 1, part.rx, part.ry, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // rib lines
  ctx.strokeStyle = '#c96a18';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.ellipse(-3.5, 1, 3.2, 7.3, 0, -Math.PI/2, Math.PI/2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(3.5, 1, 3.2, 7.3, 0, Math.PI/2, Math.PI*1.5);
  ctx.stroke();

  // outline
  ctx.strokeStyle = '#9a5b16';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(0, 1, 10.5, 8.5, 0, 0, Math.PI*2);
  ctx.stroke();

  // stem
  ctx.strokeStyle = '#5d7f2f';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -7);
  ctx.quadraticCurveTo(1.5, -10, 4, -11);
  ctx.stroke();

  // small leaf
  ctx.fillStyle = '#5d9b3d';
  ctx.beginPath();
  ctx.ellipse(-4, -8.5, 3.2, 1.8, 0.5, 0, Math.PI*2);
  ctx.fill();

  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.20)';
  ctx.beginPath();
  ctx.ellipse(-4, -1, 2, 5, 0.15, 0, Math.PI*2);
  ctx.fill();

}

function drawShamrock(x, y, size){
  const leafW = size * 0.42;
  const leafH = size * 0.50;

  ctx.fillStyle = "#2f9e44";

  function heartLeaf(cx, cy, rotation){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.beginPath();
    ctx.moveTo(0, leafH * 0.45);
    ctx.bezierCurveTo(
      -leafW, -leafH * 0.1,
      -leafW * 0.65, -leafH,
      0, -leafH * 0.45
    );
    ctx.bezierCurveTo(
      leafW * 0.65, -leafH,
      leafW, -leafH * 0.1,
      0, leafH * 0.45
    );
    ctx.fill();
    ctx.restore();
  }

  heartLeaf(x, y - size * 0.24, 0);
  heartLeaf(x - size * 0.25, y + size * 0.07, -Math.PI / 2.5);
  heartLeaf(x + size * 0.25, y + size * 0.07, Math.PI / 2.5);

}

function makeLooseBlocks(num){
  blocks = [];
  const pts = [];
  for(let i=0;i<num;i++){
    let x = SOURCE.x;
    let y = SOURCE.y;
    let ok = false;
    let tries = 0;
    while(!ok && tries < 2000){
      x = SOURCE.x + Math.random() * (SOURCE.w - BLOCK);
      y = SOURCE.y + Math.random() * (SOURCE.h - BLOCK);
      ok = true;
      for(const p of pts){
        if(Math.hypot(x - p.x, y - p.y) < BLOCK + 6){
          ok = false;
          break;
        }
      }
      tries++;
    }
    pts.push({x,y});
    blocks.push({
      x, y,
      startX:x, startY:y,
      zone:'loose',
      rod:null,
      slot:null,
      hidden:false
    });
  }
  order = shuffle([...Array(num).keys()]);
}

function prepareNumber(num){
  preparedNumber = num;
  currentItemType = itemSel.value;
  currentCountMode = countModeSel.value;
  revealed = false;
  running = false;
  paused = false;
  mode = 'idle';
  if(rafId) cancelAnimationFrame(rafId);
  rafId = null;

  forwardPlan = [];
  forwardIndex = 0;
  forwardStart = 0;
  forwardPauseStart = 0;

  backwardState = 'idle';
  backwardStart = 0;
  currentTravel = null;
  removeSlot = -1;
  extraTenMarker = 0;

  visibleTotal = 0;
  tensDisplay = 0;
  onesDisplay = 0;

  makeLooseBlocks(num);
  draw();
}

function buildForwardPlan(){
  forwardPlan = [];

  if(isShowOnesOnly()){
    for(let i=0;i<preparedNumber;i++){
      const id = order[i];
      const p = onesGridPos(i);
      forwardPlan.push({type:'toOnes', id, tx:p.x, ty:p.y, slot:i});
    }
    return;
  }

  if(isTensFirstMode()){
    const fullTens = Math.floor(preparedNumber / 10);
    const ones = preparedNumber % 10;

    for(let r=0;r<fullTens;r++){
      const ids = [];
      for(let j=0;j<10;j++) ids.push(order[r * 10 + j]);
      forwardPlan.push({type:'toRodDirect', ids, rod:r});
      forwardPlan.push({type:'countTenDirect'});
    }

    for(let i=0;i<ones;i++){
      const id = order[fullTens * 10 + i];
      const p = onesGridPos(i);
      forwardPlan.push({type:'toOnes', id, tx:p.x, ty:p.y, slot:i});
    }
    return;
  }

  const seen = [];
  for(let i=0;i<preparedNumber;i++){
    const id = order[i];
    seen.push(id);
    const slot = i % 10;
    const p = onesGridPos(slot);
    forwardPlan.push({type:'toOnes', id, tx:p.x, ty:p.y, slot});

    if((i + 1) % 10 === 0){
      const rod = Math.floor(i / 10);
      const ids = seen.slice(rod * 10, rod * 10 + 10);
      const base = onesLinePos(0);
      forwardPlan.push({type:'lineUp', ids, rod, baseX:base.x, baseY:base.y});
      forwardPlan.push({type:'pause'});
      forwardPlan.push({type:'toRod', ids, rod});
      forwardPlan.push({type:'countTen'});
    }
  }
}

function startForward(){
  if(running || paused) return;
  mode = 'forward';
  makeLooseBlocks(preparedNumber);
  buildForwardPlan();
  forwardIndex = 0;
  forwardStart = 0;
  forwardPauseStart = 0;
  visibleTotal = 0;
  tensDisplay = 0;
  onesDisplay = 0;
  running = true;
  rafId = requestAnimationFrame(loop);
}

function setupBackwardState(){
  makeLooseBlocks(preparedNumber);
  const fullTens = Math.floor(preparedNumber / 10);
  const ones = preparedNumber % 10;

  if(isShowOnesOnly()){
    for(let i=0;i<preparedNumber;i++){
      const id = order[i];
      const p = onesGridPos(i);
      const b = blocks[id];
      b.x = p.x;
      b.y = p.y;
      b.zone = 'ones';
      b.rod = null;
      b.slot = i;
      b.hidden = false;
    }
    visibleTotal = preparedNumber;
    tensDisplay = 0;
    onesDisplay = preparedNumber;
    extraTenMarker = 0;
    currentTravel = null;
    backwardState = preparedNumber > 0 ? 'remove' : 'done';
    removeSlot = preparedNumber - 1;
    backwardStart = 0;
    return;
  }

  for(let r=0;r<fullTens;r++){
    for(let j=0;j<10;j++){
      const id = order[r * 10 + j];
      const p = rodPos(j, r);
      const b = blocks[id];
      b.x = p.x;
      b.y = p.y;
      b.zone = 'rod';
      b.rod = r;
      b.slot = null;
      b.hidden = false;
    }
  }

  for(let i=0;i<ones;i++){
    const id = order[fullTens * 10 + i];
    const p = onesGridPos(i);
    const b = blocks[id];
    b.x = p.x;
    b.y = p.y;
    b.zone = 'ones';
    b.rod = null;
    b.slot = i;
    b.hidden = false;
  }

  visibleTotal = preparedNumber;
  tensDisplay = fullTens;
  onesDisplay = ones;
  extraTenMarker = 0;
  currentTravel = null;
  backwardState = ones > 0 ? 'remove' : (fullTens > 0 ? 'preBreakPause' : 'done');
  removeSlot = ones - 1;
  backwardStart = 0;
}

function updateForward(now){
  if(forwardIndex >= forwardPlan.length){
    running = false;
    if(visibleTotal === preparedNumber){
      
    }
    return;
  }

  const step = forwardPlan[forwardIndex];

  if(step.type === 'pause'){
    if(!forwardPauseStart) forwardPauseStart = now;
    if(now - forwardPauseStart >= 1000){
      forwardIndex++;
      forwardPauseStart = 0;
    }
    return;
  }

  if(step.type === 'countTen'){
    if(!forwardPauseStart) forwardPauseStart = now;
    if(now - forwardPauseStart >= TEN_PAUSE_MS){
      tensDisplay++;
      onesDisplay = 0;
      forwardIndex++;
      forwardPauseStart = 0;
    }
    return;
  }

  if(step.type === 'countTenDirect'){
    if(!forwardPauseStart) forwardPauseStart = now;
    if(now - forwardPauseStart >= TEN_PAUSE_MS){
      visibleTotal += 10;
      tensDisplay++;
      onesDisplay = 0;
      forwardIndex++;
      forwardPauseStart = 0;
    }
    return;
  }

  if(!forwardStart){
    if(step.ids){
      step.starts = step.ids.map(id => ({id, x:blocks[id].x, y:blocks[id].y}));
    } else {
      const b = blocks[step.id];
      b.startX = b.x;
      b.startY = b.y;
    }
    forwardStart = now;
  }

  if(step.type === 'toRodDirect'){
    const elapsed = now - forwardStart;
    const t = Math.min(1, elapsed / ROD_MOVE_MS);
    const e = ease(t);

    for(let i=0;i<step.ids.length;i++){
      const s = step.starts[i];
      const b = blocks[s.id];
      const target = rodPos(i, step.rod);
      b.x = s.x + (target.x - s.x) * e;
      b.y = s.y + (target.y - s.y) * e;
      b.zone = 'rod';
      b.rod = step.rod;
      b.slot = null;
    }

    if(t >= 1){
      forwardIndex++;
      forwardStart = 0;
    }
    return;
  }

  if(step.type === 'toOnes'){
    const b = blocks[step.id];
    const elapsed = now - forwardStart;
    const t = Math.min(1, elapsed / FORWARD_MOVE_MS);
    const e = ease(t);
    const smooth = e * e * (3 - 2 * e);

    b.x = b.startX + (step.tx - b.startX) * smooth;
    b.y = b.startY + (step.ty - b.startY) * smooth;
    b.zone = 'ones';
    b.slot = step.slot;

    if(t >= 1 && elapsed >= FORWARD_MOVE_MS + FORWARD_SMALL_PAUSE_MS){
      b.x = step.tx;
      b.y = step.ty;
      visibleTotal++;
      onesDisplay++;
      forwardIndex++;
      forwardStart = 0;
    }
    return;
  }

  if(step.type === 'lineUp'){
    const elapsed = now - forwardStart;
    const t = Math.min(1, elapsed / LINE_UP_MS);
    const e = ease(t);

    for(let i=0;i<step.ids.length;i++){
      const s = step.starts[i];
      const b = blocks[s.id];
      const target = onesLinePos(i);
      b.x = s.x + (target.x - s.x) * e;
      b.y = s.y + (target.y - s.y) * e;
      b.zone = 'ones';
      b.slot = i;
    }

    if(t >= 1){
      forwardIndex++;
      forwardStart = 0;
    }
    return;
  }

  if(step.type === 'toRod'){
    const elapsed = now - forwardStart;
    const t = Math.min(1, elapsed / ROD_MOVE_MS);
    const e = ease(t);

    for(let i=0;i<step.ids.length;i++){
      const s = step.starts[i];
      const b = blocks[s.id];
      const target = rodPos(i, step.rod);
      b.x = s.x + (target.x - s.x) * e;
      b.y = s.y + (target.y - s.y) * e;
      b.zone = 'rod';
      b.rod = step.rod;
      b.slot = null;
    }

    if(t >= 1){
      forwardIndex++;
      forwardStart = 0;
    }
  }
}

function beginBackwardRodTravel(now){
  const rodIndex = tensDisplay - 1;
  const ids = [];
  for(let j=0;j<10;j++) ids.push(order[rodIndex * 10 + j]);
  currentTravel = {
    rod: rodIndex,
    ids,
    starts: ids.map(id => ({id, x:blocks[id].x, y:blocks[id].y}))
  };
  tensDisplay--;
  extraTenMarker = 1;
  backwardState = 'rodTravel';
  backwardStart = now;
}

function updateBackward(now){
  if(visibleTotal <= 0){
    running = false;
    return;
  }

  if(backwardState === 'preBreakPause'){
    if(!backwardStart) backwardStart = now;
    if(now - backwardStart >= BACKWARD_PRE_BREAK_PAUSE_MS){
      backwardStart = 0;
      beginBackwardRodTravel(now);
    }
    return;
  }

  if(backwardState === 'rodTravel'){
    const elapsed = now - backwardStart;
    const t = Math.min(1, elapsed / BACKWARD_ROD_MOVE_MS);
    const e = ease(t);

    for(let i=0;i<currentTravel.ids.length;i++){
      const s = currentTravel.starts[i];
      const b = blocks[s.id];
      const target = onesGridPos(i);
      b.x = s.x + (target.x - s.x) * e;
      b.y = s.y + (target.y - s.y) * e;
      b.zone = 'rodTravel';
      b.rod = currentTravel.rod;
      b.hidden = false;
    }

    if(t >= 1){
      for(let i=0;i<currentTravel.ids.length;i++){
        const id = currentTravel.ids[i];
        const b = blocks[id];
        const target = onesGridPos(i);
        b.x = target.x;
        b.y = target.y;
        b.zone = 'ones';
        b.rod = null;
        b.slot = i;
        b.hidden = false;
      }
      onesDisplay = 10;
      removeSlot = 9;
      currentTravel = null;
      extraTenMarker = 1;
      backwardState = 'remove';
      backwardStart = 0;
    }
    return;
  }

  if(backwardState === 'remove'){
    if(removeSlot < 0){
      if(tensDisplay > 0){
        backwardState = 'preBreakPause';
        backwardStart = 0;
      } else {
        running = false;
      }
      return;
    }

    const removeId = isShowOnesOnly() ? order[removeSlot] : order[tensDisplay * 10 + removeSlot];
    const b = blocks[removeId];

    if(!backwardStart){
      backwardStart = now;
      b.startX = b.x;
      b.startY = b.y;
    }

    const elapsed = now - backwardStart;
    const t = Math.min(1, elapsed / (BACKWARD_REMOVE_MS * 0.5));
    const fade = 1 - t;
    b.fade = fade;

    if(t >= 1){
      b.hidden = true;
      b.zone = 'gone';
      b.slot = null;
      b.rod = null;
      b.fade = 1;
      visibleTotal--;
      backwardStart = now + 300; // match forward pause between images
      onesDisplay--;
      removeSlot--;
      backwardStart = 0;
      if(extraTenMarker === 1) extraTenMarker = 0;
    }
    return;
  }
}

function update(now){
  if(!running || paused) return;
  if(mode === 'forward') updateForward(now);
  if(mode === 'backward') updateBackward(now);
}

function drawNumberLine(){
  const sx = 70;
  const ex = 930;
  const y = 70;
  const step = (ex - sx) / 100;

  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx, y);
  ctx.lineTo(ex, y);
  ctx.stroke();

  for(let i=1;i<=100;i++){
    const x = sx + i * step;
    const fifthReached = i % 5 === 0 && i <= visibleTotal;

    ctx.fillStyle = fifthReached ? '#d18b00' : (i <= visibleTotal ? '#5a7da8' : '#ccc');
    ctx.fillRect(x - 2, y - 14, 4, 28);
  }

  ctx.fillStyle = '#d18b00';
  ctx.font = '700 13px Arial';
  ctx.textAlign = 'center';

  const tensReached = Math.floor(visibleTotal / 10);
  for(let t=1;t<=tensReached;t++){
    const value = t * 10;
    const x = sx + value * step;
    ctx.beginPath();
    ctx.arc(x, y - 12, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillText(String(value), x, y - 22);
  }
}

function drawRodBackings(){
  if(isShowOnesOnly()) return;
  for(let r=0;r<tensDisplay;r++){
    const x = RODS.x - 4;
    const y = RODS.y + r * ROD_ROW - 2;
    ctx.fillStyle = '#fff3d8';
    ctx.strokeStyle = '#e3c78f';
    rr(x, y, 10 * ROD_CELL + 8, 24, 6);
    ctx.fill();
    ctx.stroke();
  }
}

function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawNumberLine();

  ctx.fillStyle = '#5a7da8';
  ctx.font = '700 26px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(ITEM_LABELS[currentItemType], SOURCE.x + SOURCE.w / 2, HEADER_Y);

  if(showHeadersForMode()){
    if(isShowOnesOnly()){
      ctx.fillText(String(onesDisplay) + ' Ones', RODS.x + 220, HEADER_Y);
    } else {
      const tensWord = tensDisplay === 1 ? ' Ten' : ' Tens';
      ctx.fillText(String(tensDisplay) + tensWord, RODS.x + (10 * ROD_CELL) / 2, HEADER_Y);
      const onesStartX = ONES.x + 70;
      const onesHeaderX = onesStartX + (4 * ONES_CELL + BLOCK) / 2;
      ctx.fillText(String(onesDisplay) + ' Ones', onesHeaderX, HEADER_Y);
    }
  }

  if(revealed && visibleTotal === preparedNumber && !running && mode === 'forward'){
    ctx.fillStyle = '#2f3e50';
    ctx.font = '700 44px Arial';
    // align top of numeral with first ten rod
    ctx.textBaseline = 'top';
    ctx.fillText(String(preparedNumber), SOURCE.x + SOURCE.w / 2, RODS.y);
    ctx.textBaseline = 'alphabetic';
  }

  drawRodBackings();

  for(let i=0;i<blocks.length;i++){
    const b = blocks[i];
    if(b.hidden) continue;

    let fill = '#5a7da8';
    let stroke = '#48698f';

    const traveling = currentTravel && currentTravel.ids.includes(i);
    if(!isShowOnesOnly() && ((b.zone === 'rod' && b.rod !== null && b.rod < tensDisplay) || traveling || b.zone === 'rodTravel')){
      fill = '#d6a754';
      stroke = '#9a732a';
    }

    const alpha = typeof b.fade === 'number' ? b.fade : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(255,255,255,0)";
    ctx.strokeStyle = stroke;
    ctx.fillRect(b.x, b.y, BLOCK, BLOCK);
    drawItemIcon(b.x, b.y);
    ctx.restore();
  }
}

function loop(now){
  update(now);
  draw();
  if(running) rafId = requestAnimationFrame(loop);
}

pauseBtn.onclick = () => {
  if(running) paused = !paused;
};

sel.addEventListener('change', () => {
  prepareNumber(Number(sel.value));
  sel.style.visibility = 'hidden';
});


countModeSel.addEventListener('change', () => {
  currentCountMode = countModeSel.value;
  prepareNumber(Number(sel.value));
});

itemSel.addEventListener('change', () => {
  currentItemType = itemSel.value;
  draw();
});

convertBtn.onclick = switchBuiltNumberView;

revealBtn.onclick = () => {
  sel.style.visibility = 'visible';
  revealed = true;
  draw();
};

forwardBtn.onclick = startForward;
backwardBtn.onclick = startBackward;
resetBtn.onclick = resetAll;

sel.value = '0';
prepareNumber(0);

let page = 1;
function updatePageCounter(){
  const pc = document.getElementById('pageCounter');
  if(pc) pc.textContent = page;
}

// increment on reset (acts like new page)
document.getElementById('resetBtn').addEventListener('click', ()=>{
  page++;
  updatePageCounter();
});

// initialize
updatePageCounter();

</script>
